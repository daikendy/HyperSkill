spring.application.name=Quiz-Backend-System

# ===============================
# = DATA SOURCE (Hybrid Configuration)
# ===============================
# The syntax ${VAR_NAME:default} means:
# "Try to find an environment variable named VAR_NAME."
# "If you can't find it (like on your laptop), use the default value after the colon."

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quizzes}
spring.datasource.username=${DB_USERNAME:quizzes-db}
spring.datasource.password=${DB_PASSWORD:123098123098Kk}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = DEPLOYMENT CONFIG
# ===============================
# This tells Spring to listen on the port Render gives us (PORT), 
# or default to 8080 if running locally.
server.port=${PORT:8080}